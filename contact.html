<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us – Kwadaso Waste App</title>
  <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="shortcut icon" href="/images/favicon.png" type="image/x-icon">
</head>
<style>

   /* General */
body {
  font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
  background-color: #f9f9f9;
  color: #333;
}

h1, h2, h3, h4 {
  font-weight: 600;
}

a {
  text-decoration: none;
  color: #198754;
}

a:hover {
  color: #146c43;
}

/* Navbar */
.custom-navbar {
      padding: 0.8rem 1rem;
      background-color: rgba(25, 135, 84, 0.9);
      backdrop-filter: blur(6px);
    
    }

    .navbar {
  padding-top: 0.5rem;
  padding-bottom: 0.5rem;
  background-color: #198754;
}

@media (max-width: 768px) {
  .navbar-brand {
    margin-right: auto;
    height: 150px;
  }
}

    .navbar-brand img {
  height: 150px;
  width: auto;
  object-fit: contain;
}

.nav-link {
  color: #ffffff !important;
  font-weight: 500;
}

.nav-link:hover {
  text-decoration: underline;
}

/* Hero section */
.bg-success {
  background-color: #198754 !important;
}

.text-white {
  color: white;
}

/* Form */
form .form-label {
  font-weight: 500;
}

form .form-control {
  border-radius: 0.3rem;
  border: 1px solid #ccc;
  padding: 0.75rem;
  font-size: 1rem;
}

form .btn-success {
  padding: 0.6rem 1.5rem;
  font-weight: 500;
  font-size: 1rem;
  border-radius: 0.3rem;
}

/* Google Maps */
iframe {
  border-radius: 0.5rem;
}

/* Footer */
footer {
  background-color:#198754;
  color: #d1d1d1;
  font-size: 0.95rem;
}

/* Responsive */
@media (max-width: 768px) {
  .navbar-brand img {
    height: 150px;
  }

  .navbar-nav {
    text-align: center;
    margin-top: 1rem;
  }

  .navbar-nav .nav-item {
    margin-bottom: 0.5rem;
  }
}

/* Animations */
@keyframes fadeUp {
  0% {
    opacity: 0;
    transform: translateY(20px);
  }
  100% {
    opacity: 1;
    transform: translateY(0);
  }
}

.fade-up {
  animation: fadeUp 0.6s ease-in-out;
}

/* Alerts */
#formAlert {
  font-weight: 500;
}
 
</style>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark custom-navbar sticky-top">
    <div class="container-fluid d-flex justify-content-between align-items-center">
      <a class="navbar-brand d-flex align-items-center" href="index.html">
        <img src="/images/navlogo.png" alt="Kwadaso Waste Logo" />
      </a>
      <button class="navbar-toggler ms-auto" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="services.html">Services</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="education.html">Education</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link" href="https://kwadasowaste.base44.app/" id="accountsBtn">Accounts</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contact Header -->
  <section class="bg-success text-white text-center py-5">
    <div class="container">
      <h1 class="display-5 fw-bold">Contact Us</h1>
      <p class="lead">Have questions or suggestions? We’d love to hear from you.</p>
    </div>
  </section>

  <!-- Contact Form Section -->
  <section class="container py-5">
    <div class="row g-5">
      <div class="col-md-6">
        <h3>Send Us a Message</h3>
        <form id="contactForm">
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <input type="text" id="name" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <input type="email" id="email" class="form-control" required />
          </div>
          <div class="mb-3">
            <label for="message" class="form-label">Your Message</label>
            <textarea id="message" class="form-control" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn-success">Send</button>
          <div id="formAlert" class="mt-3"></div>
        </form>
      </div>

      <div class="col-md-6">
        <h3>Visit Us</h3>
        <p>Kwadaso Municipal Office, Kumasi, Ghana</p>
        <iframe 
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d126909.93342474094!2d-1.6611553499999998!3d6.688020099999999!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0xfdcba763f0d3e01%3A0x6c6e6c5de46df7f!2sKwadaso%2C%20Kumasi!5e0!3m2!1sen!2sgh!4v1620000000000!5m2!1sen!2sgh" 
          width="100%" height="300" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="py-4 mt-5">
    <div class="container text-center">
      <p class="mb-0">© 2025 Kwadaso Waste Management. All rights reserved.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module">
    // Firebase Integration Placeholder
    // Replace with your Firebase config and Firestore calls
    document.getElementById("contactForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const name = document.getElementById("name").value.trim();
      const email = document.getElementById("email").value.trim();
      const message = document.getElementById("message").value.trim();
      const alert = document.getElementById("formAlert");

      if (!name || !email || !message) {
        alert.innerHTML = "<div class='text-danger'>All fields are required.</div>";
        return;
      }

      try {
        // await firebase.firestore().collection('messages').add({ name, email, message, timestamp: Date.now() });
        alert.innerHTML = "<div class='text-success'>Message sent successfully!</div>";
        document.getElementById("contactForm").reset();
      } catch (err) {
        alert.innerHTML = "<div class='text-danger'>Something went wrong. Please try again later.</div>";
      }
    });
  </script>
</body>
</html>
